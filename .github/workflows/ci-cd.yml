name: CI/CD

on:
  push:
    branches: [Development]
  pull_request:
    branches: [Development]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: [self-hosted, windows, property-admin-self-hosted]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm test -- --watch=false

  build:
    name: Build
    runs-on: [self-hosted, windows, property-admin-self-hosted]
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/portal-dashboard/browser/
          retention-days: 3
          if-no-files-found: error

  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, windows, property-admin-self-hosted]
    needs: build
    if: github.event_name == 'push'
    environment:
      name: production
      url: https://soletechs.net/property.admin

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/portal-dashboard/browser/

      # Required GitHub Secrets (Settings → Secrets → Actions):
      #   FTP_SERVER      e.g. ftp.soletechs.net
      #   FTP_USERNAME    your FTP username
      #   FTP_PASSWORD    your FTP password
      #   FTP_SERVER_DIR  remote path, e.g. /public_html/property.admin/
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/portal-dashboard/browser/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
