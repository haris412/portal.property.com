<section class="step-card">
  <div class="step-card__accent" aria-hidden="true"></div>

  <div class="step-card__content">
    <header class="step-card__header">
      <span class="step-card__badge">{{ step() }}</span>

      <div class="step-card__copy">
        <h2 class="step-card__title">{{ title() }}</h2>

        @if (description()) {
          <p class="step-card__description">{{ description() }}</p>
        }
      </div>
    </header>

    <div class="step-card__body">
      <ng-content />
    </div>
  </div>
</section>
