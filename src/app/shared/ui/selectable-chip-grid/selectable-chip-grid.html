<div class="row g-3">
  @for (item of items(); track item.id) {
    <div class="col-12 col-sm-6 col-lg-4">
      <button
        type="button"
        class="selectable-chip-grid__chip"
        [class.selectable-chip-grid__chip--selected]="item.selected"
        [attr.aria-pressed]="item.selected"
        (click)="toggled.emit(item.id)"
      >
        <mat-icon
          class="selectable-chip-grid__icon"
          [fontIcon]="item.selected ? (item.iconSelected || 'check') : (item.iconUnselected || 'add')"
          aria-hidden="true"
        ></mat-icon>

        <span>{{ item.label }}</span>
      </button>
    </div>
  }
</div>
