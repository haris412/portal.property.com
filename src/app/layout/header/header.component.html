<header class="header">
  <div class="header__inner">
    <div class="header__left">
      <button
        type="button"
        class="header__menu-toggle"
        (click)="onMenuToggle()"
        aria-label="Toggle menu"
      >
        <mat-icon fontIcon="menu" aria-hidden="true"></mat-icon>
      </button>

      <!-- <h1 class="header__title">{{ pageTitle() }}</h1> -->
    </div>

    <div class="header__right">
      <div class="header__search">
        <mat-icon class="header__search-icon" fontIcon="search" aria-hidden="true"></mat-icon>

        <input
          type="text"
          class="header__search-input"
          placeholder="Search..."
          aria-label="Search"
        />
      </div>

      <button
        type="button"
        class="header__icon-button"
        aria-label="Notifications"
      >
        <mat-icon fontIcon="notifications_none" aria-hidden="true"></mat-icon>
        <span class="header__badge">3</span>
      </button>

      <div class="header__user-menu">
        <button
          type="button"
          class="header__user-trigger"
          (click)="toggleUserMenu()"
          [attr.aria-expanded]="userMenuOpen()"
          aria-label="Open user menu"
        >
          <span class="header__avatar">{{ userInitials() }}</span>
          <span class="header__user-name">{{ userName() }}</span>
          <mat-icon fontIcon="expand_more" aria-hidden="true"></mat-icon>
        </button>

        @if (userMenuOpen()) {
          <div class="header__dropdown">
            <a
              routerLink="/settings"
              class="header__dropdown-item"
              (click)="closeUserMenu()"
            >
              <mat-icon fontIcon="settings" aria-hidden="true"></mat-icon>
              <span>Settings</span>
            </a>

            <div class="header__dropdown-divider"></div>

            <button
              type="button"
              class="header__dropdown-item header__dropdown-item--danger"
              (click)="logout()"
            >
              <mat-icon fontIcon="logout" aria-hidden="true"></mat-icon>
              <span>Logout</span>
            </button>
          </div>
        }
      </div>
    </div>
  </div>
</header>
