<div class="admin-access-denied">
  <div class="section-card admin-access-denied__card">
    <h1 class="admin-access-denied__title">Access denied</h1>
    <p class="admin-access-denied__body">{{ message }}</p>
    <div class="admin-access-denied__actions">
      <a mat-raised-button color="primary" routerLink="/auth">User portal sign in</a>
      <a mat-stroked-button routerLink="/dashboard">Go to home</a>
      <a mat-button routerLink="/admin/auth">Try another admin account</a>
    </div>
  </div>
</div>
