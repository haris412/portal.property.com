<h2 mat-dialog-title>{{ 'verification.admin.rejectTitle' | translate }}</h2>

<mat-dialog-content>
  <p class="reject-verification-dialog__copy">{{ 'verification.admin.rejectMessage' | translate }}</p>
  <mat-form-field appearance="outline" class="w-100">
    <mat-label>{{ 'verification.admin.reason' | translate }}</mat-label>
    <textarea
      matInput
      rows="4"
      [value]="reason()"
      (input)="reason.set($any($event.target).value)"
    ></textarea>
    @if (!reason().trim()) {
      <mat-hint>{{ 'verification.admin.reasonRequired' | translate }}</mat-hint>
    }
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">{{ 'base.cancel' | translate }}</button>
  <button mat-flat-button color="warn" type="button" [disabled]="!reason().trim()" (click)="confirm()">
    {{ 'verification.admin.reject' | translate }}
  </button>
</mat-dialog-actions>
