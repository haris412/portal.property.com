<div class="admin-auth-shell-bg">
  <div class="container">
    <div class="admin-auth-shell">
      <div class="row g-4 align-items-stretch admin-auth-layout-row">
        <div class="d-none d-lg-block col-lg-6 admin-hero-column">
          <app-admin-auth-hero-panel />
        </div>

        <div class="col-12 col-lg-6">
          <section class="admin-right-column">
            <div class="admin-auth-header">
              <p class="admin-auth-eyebrow">Administrator</p>
              <h1 class="admin-auth-heading">LocateHome admin</h1>
              <p class="admin-auth-sub text-muted-auth">
                Sign in with an existing admin account. This area is separate from the public property portal.
              </p>
            </div>

            <div class="admin-auth-form-area mt-3">
              <div class="admin-auth-card-anim" animate.enter="admin-auth-card-enter">
                <app-admin-login-card />
              </div>
            </div>

            <p class="admin-portal-link-wrap mt-4 mb-0">
              <a routerLink="/auth" class="auth-link">Not an admin? Open the user portal</a>
            </p>
          </section>
        </div>
      </div>
    </div>
  </div>
</div>
