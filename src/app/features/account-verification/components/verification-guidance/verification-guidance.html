<div class="verification-guidance row g-3">
  <section class="col-12 col-lg-7">
    <div class="section-card verification-guidance__card h-100">
      <h3>{{ title() }}</h3>
      <p>{{ description() }}</p>
      <div class="verification-guidance__points">
        <ng-content select="[guidance-points]" />
      </div>
    </div>
  </section>

  <section class="col-12 col-lg-5">
    <div class="section-card verification-guidance__card verification-guidance__example">
      <h3>{{ exampleTitle() }}</h3>
      <p>{{ exampleDescription() }}</p>
      <img [src]="exampleImage()" [alt]="exampleAlt()" />
      <p class="verification-guidance__caption">{{ exampleCaption() }}</p>
    </div>
  </section>
</div>
