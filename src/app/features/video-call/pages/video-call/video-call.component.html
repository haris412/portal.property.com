<section class="video-call" [class.video-call--chat-open]="chatOpen">
  <div class="video-call__shell">
    <main class="video-call__meeting" aria-label="Video call room">
      <app-video-call-topbar
        [callRoomLabel]="callRoomLabel"
        [remoteDisconnected]="remoteDisconnected"
        [remoteHasVideo]="remoteHasVideo"
        [isMuted]="isMuted"
        [isVideoOff]="isVideoOff"
        [chatOpen]="chatOpen"
        (muteToggle)="toggleMute()"
        (videoToggle)="toggleVideo()"
        (endCall)="endCall()"
        (appointmentsBack)="goToAppointments()"
        (chatToggle)="toggleChat()"
      />

      @if (transientBanner) {
        <div class="video-call__banner video-call__banner--info" role="status">
          {{ transientBanner }}
        </div>
      }
      @if (statusText) {
        <div class="video-call__banner video-call__banner--alert" role="alert">
          {{ statusText }}
        </div>
      }

      <div class="video-call__stage">
        <div class="video-call__stage-main">
          @if (!remoteHasVideo && !remoteDisconnected) {
            <div class="video-call__placeholder">
              <mat-icon fontSet="material-symbols-outlined" inline aria-hidden="true">person</mat-icon>
              <span>Waiting for their camera</span>
            </div>
          }
          @if (remoteDisconnected) {
            <div class="video-call__placeholder">
              <mat-icon fontSet="material-symbols-outlined" inline aria-hidden="true">call_end</mat-icon>
              <span>The other participant left the call</span>
            </div>
          }
          <video
            #remoteVideo
            class="video-call__video video-call__video--main"
            [class.video-call__video--hidden]="!remoteHasVideo"
            autoplay
            playsinline
          ></video>
        </div>

        <div class="video-call__pip" [class.video-call__pip--off]="isVideoOff" aria-label="Your camera preview">
          <video #localVideo class="video-call__video video-call__video--pip" autoplay playsinline muted></video>
          @if (isVideoOff) {
            <div class="video-call__pip-off">
              <mat-icon fontSet="material-symbols-outlined" inline aria-hidden="true">videocam_off</mat-icon>
            </div>
          }
          <span class="video-call__pip-label">You</span>
        </div>
      </div>
    </main>

    <app-video-call-chat-panel
      [open]="chatOpen"
      [connected]="chatConnected"
      [messages]="chatMessages"
      (close)="closeChat()"
      (messageSend)="sendChatMessage($event)"
    />
  </div>
</section>
