<section class="video-call">
  <header class="video-call__toolbar">
    <div class="video-call__room">
      <span class="video-call__room-label">Room</span>
      <strong class="video-call__room-name">{{ callRoomLabel }}</strong>
    </div>
  </header>

  @if (transientBanner) {
    <div class="video-call__banner video-call__banner--info" role="status">{{ transientBanner }}</div>
  }
  @if (statusText) {
    <div class="video-call__banner video-call__banner--alert" role="alert">{{ statusText }}</div>
  }

  <!-- Teams / Skype style: large main (other), small PiP (you), controls on the video -->
  <div class="video-call__stage">
    <div class="video-call__stage-main">
      <span class="video-call__stage-label">Other participant</span>
      @if (!remoteHasVideo && !remoteDisconnected) {
        <div class="video-call__placeholder">Waiting for their camera…</div>
      }
      <video
        #remoteVideo
        class="video-call__video video-call__video--main"
        [class.video-call__video--hidden]="!remoteHasVideo && !remoteDisconnected"
        autoplay
        playsinline
      ></video>
    </div>

    <div class="video-call__pip" aria-label="Your camera preview">
      <span class="video-call__pip-label">You</span>
      <video #localVideo class="video-call__video video-call__video--pip" autoplay playsinline muted></video>
    </div>

    <div class="video-call__stage-actions">
      @if (!remoteDisconnected) {
        <button type="button" class="btn btn-danger video-call__btn-end" (click)="endCall()">End call</button>
      } @else {
        <button type="button" class="btn btn-primary video-call__btn-end" (click)="goToAppointments()">
          Back to appointments
        </button>
      }
    </div>
  </div>
</section>
