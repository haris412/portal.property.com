<div class="properties-page container-fluid py-4">
  <app-page-header
    [title]="'properties.title' | translate"
    [subtitle]="'properties.subtitle' | translate"
    [actions]="headerActions"
    (actionClicked)="onHeaderAction($event)"
  />

  <app-section-card
    [title]="'properties.listings.title' | translate"
    [description]="'properties.listings.description' | translate"
  >
    @if (loadError(); as err) {
      <app-info-banner class="d-block mb-3" icon="error_outline" [text]="err" />
    }

    @if (loading()) {
      <p class="text-muted mb-3">{{ 'properties.loading' | translate }}</p>
    }

    <app-data-grid
      [rowData]="propertyRows()"
      [columnDefs]="propertyColumnDefs"
      [gridOptionsInput]="gridOptions"
      [heightPx]="520"
      [pagination]="false"
      (gridReady)="onGridReady($event)"
    />

    <div class="properties-page__pager d-flex flex-wrap align-items-center gap-3 mt-3">
      <button
        type="button"
        class="btn btn-outline-secondary btn-sm"
        [disabled]="loading() || page() <= 1"
        (click)="goPrev()"
      >
        {{ 'pagination.previous' | translate }}
      </button>
      <span class="text-muted small">
        {{ 'pagination.page' | translate: { current: page(), total: totalPages() || 1 } }}
        · {{ 'pagination.total' | translate: { count: total() } }}
      </span>
      <button
        type="button"
        class="btn btn-outline-secondary btn-sm"
        [disabled]="loading() || totalPages() === 0 || page() >= totalPages()"
        (click)="goNext()"
      >
        {{ 'pagination.next' | translate }}
      </button>
    </div>
  </app-section-card>
</div>
