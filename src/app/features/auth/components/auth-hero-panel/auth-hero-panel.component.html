<section class="hero-panel position-relative overflow-hidden">
  <img
    ngSrc="images/hero-img.png"
    width="900"
    height="1200"
    priority
    alt="Luxury residential property with pool during sunset"
    class="hero-image"
  />

  <div class="hero-overlay"></div>

  <div class="hero-content d-flex flex-column h-100">
    <div class="hero-top">
      <app-brand-logo />
    </div>

    <div class="hero-copy mt-auto">
      <h1 class="hero-title">
        {{ 'public.hero.title' | translate }}
      </h1>

      <p class="hero-description">
        {{ 'public.hero.description' | translate }}
      </p>
    </div>
  </div>
</section>
