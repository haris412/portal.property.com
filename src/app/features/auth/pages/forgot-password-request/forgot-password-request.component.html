<section class="section-card auth-card h-100" aria-labelledby="forgot-title">
  <div class="card-inner">
    <h2 id="forgot-title" class="auth-card-title">{{ 'public.forgotPassword.heading' | translate }}</h2>
    <p class="auth-card-copy text-muted-auth">
      {{ 'public.forgotPassword.description' | translate }}
    </p>

    @if (error()) {
      <div class="alert alert-danger mb-3" role="alert">
        {{ error() }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label-auth" for="forgot-email">{{ 'public.forgotPassword.email' | translate }}</label>
          <mat-form-field appearance="outline">
            <input
              id="forgot-email"
              matInput
              formControlName="email"
              type="email"
              placeholder="jane@example.com"
              autocomplete="email"
            />
          </mat-form-field>
          <app-form-field-error [control]="form.controls.email" [label]="'public.forgotPassword.email' | translate" />
        </div>

        <div class="col-12">
          <button
            type="submit"
            mat-raised-button
            class="auth-primary-btn w-100"
            [disabled]="!emailValid() || loading()"
          >
            {{ loading() ? ('public.forgotPassword.ctaLoading' | translate) : ('public.forgotPassword.cta' | translate) }}
          </button>
        </div>

        <div class="col-12 text-center">
          <a routerLink="/auth" class="auth-link">{{ 'public.forgotPassword.backToSignIn' | translate }}</a>
        </div>
      </div>
    </form>
  </div>
</section>
