<section class="section-card auth-card h-100" aria-labelledby="invite-pw-title">
  <div class="card-inner">
    <h2 id="invite-pw-title" class="auth-card-title">Set your password</h2>
    <p class="auth-card-copy text-muted-auth">
      Choose a strong password to activate your account. You will sign in with it on the next screen.
    </p>

    @if (error()) {
      <div class="alert alert-danger mb-3" role="alert">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="row g-3">

        <div class="col-12">
          <label class="form-label-auth" for="invite-password">New password</label>
          <mat-form-field appearance="outline">
            <input
              id="invite-password"
              matInput
              [type]="hidePassword() ? 'password' : 'text'"
              formControlName="password"
              autocomplete="new-password"
            />
            <button
              type="button"
              mat-icon-button
              matSuffix
              [attr.aria-label]="hidePassword() ? 'Show password' : 'Hide password'"
              (click)="hidePassword.set(!hidePassword())"
            >
              <mat-icon [fontIcon]="hidePassword() ? 'visibility_off' : 'visibility'" />
            </button>
          </mat-form-field>
          <app-form-field-error [control]="form.controls.password" label="Password" />
        </div>

        <div class="col-12">
          <label class="form-label-auth" for="invite-confirm-password">Confirm password</label>
          <mat-form-field appearance="outline">
            <input
              id="invite-confirm-password"
              matInput
              [type]="hideConfirm() ? 'password' : 'text'"
              formControlName="confirmPassword"
              autocomplete="new-password"
            />
            <button
              type="button"
              mat-icon-button
              matSuffix
              [attr.aria-label]="hideConfirm() ? 'Show password' : 'Hide password'"
              (click)="hideConfirm.set(!hideConfirm())"
            >
              <mat-icon [fontIcon]="hideConfirm() ? 'visibility_off' : 'visibility'" />
            </button>
          </mat-form-field>
          <app-form-field-error [control]="form.controls.confirmPassword" label="Confirm password" />
          @if (form.touched && form.hasError('passwordsMismatch')) {
            <p class="field-hint-error mb-0" role="alert">Passwords do not match.</p>
          }
        </div>

        <div class="col-12">
          <button
            type="submit"
            mat-raised-button
            class="auth-primary-btn w-100"
            [disabled]="!canSubmit()"
          >
            {{ loading() ? 'Activating account…' : 'Activate account' }}
          </button>
        </div>

        <div class="col-12 text-center">
          <a routerLink="/auth" class="auth-link">Back to sign in</a>
        </div>

      </div>
    </form>
  </div>
</section>
