<section class="section-card auth-card h-100" aria-labelledby="otp-title">
  <div class="card-inner">
    <h2 id="otp-title" class="auth-card-title">{{ 'public.verifyOtp.heading' | translate }}</h2>
    <p class="auth-card-copy text-muted-auth">
      {{ 'public.verifyOtp.sentCodeTo' | translate }}
      <span class="fw-semibold text-break">{{ flow.email() ?? '' }}</span>{{ 'public.verifyOtp.expiresIn' | translate }}
    </p>

    @if (error()) {
      <div class="alert alert-danger mb-3" role="alert">
        {{ error() }}
      </div>
    }

    @if (resendHint()) {
      <div class="alert alert-success mb-3" role="alert">
        {{ resendHint() }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label-auth" for="reset-otp">{{ 'public.verifyOtp.otpLabel' | translate }}</label>
          <mat-form-field appearance="outline">
            <input
              id="reset-otp"
              matInput
              formControlName="otp"
              inputmode="numeric"
              autocomplete="one-time-code"
              maxlength="6"
              placeholder="000000"
              (input)="onOtpInput($event)"
            />
          </mat-form-field>
          <app-form-field-error [control]="form.controls.otp" [label]="'public.verifyOtp.otpLabel' | translate" />
        </div>

        <div class="col-12">
          <button
            type="submit"
            mat-raised-button
            class="auth-primary-btn w-100"
            [disabled]="!canSubmit()"
          >
            {{ loading() ? ('public.verifyOtp.verifying' | translate) : ('public.verifyOtp.cta' | translate) }}
          </button>
        </div>

        <div class="col-12 d-flex flex-wrap align-items-center justify-content-between gap-2">
          <button
            type="button"
            mat-button
            class="text-muted-auth"
            [disabled]="resendLoading()"
            (click)="resend()"
          >
            {{ resendLoading() ? ('public.verifyOtp.resending' | translate) : ('public.verifyOtp.resend' | translate) }}
          </button>
          <a routerLink="/auth" class="auth-link">{{ 'public.verifyOtp.backToSignIn' | translate }}</a>
        </div>
      </div>
    </form>
  </div>
</section>
