<section class="profile-section-card">
  <div class="profile-section-card__header">
    <h2>Password & Security</h2>
    <p>Update your password and keep your account secure.</p>
  </div>

  <form class="profile-form" [formGroup]="form" (ngSubmit)="save()">
    <div class="row g-3">
      <div class="col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Current password</mat-label>
          <input matInput type="password" formControlName="currentPassword" />
        </mat-form-field>
      </div>

      <div class="col-12 col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>New password</mat-label>
          <input matInput type="password" formControlName="newPassword" />
        </mat-form-field>
      </div>

      <div class="col-12 col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Confirm new password</mat-label>
          <input matInput type="password" formControlName="confirmPassword" />
          @if (form.hasError('passwordMismatch') && form.controls.confirmPassword.touched) {
            <mat-error>Passwords do not match</mat-error>
          }
        </mat-form-field>
      </div>
    </div>

    <div class="profile-form__actions">
        <app-action-button
          [label]="'Update Password'"
          [icon]="''"
          variant="filled"
          (clicked)="save()"
        />
    </div>
  </form>
</section>
