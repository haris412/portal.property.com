<section class="profile-section-card">
  <div class="profile-section-card__header">
    <h3>Password & Security</h3>
    <p>Update your password and keep your account secure.</p>
  </div>

  <form class="profile-form" [formGroup]="form" (ngSubmit)="save()">
    <div class="row g-3">
      <div class="col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Current password</mat-label>
          <input matInput [type]="showPassword().current ? 'text' : 'password'" formControlName="currentPassword" />
          <button mat-icon-button matSuffix type="button" (click)="showPassword.update(s => ({ ...s, current: !s.current }))">
            <mat-icon>{{ showPassword().current ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
      </div>

      <div class="col-12 col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>New password</mat-label>
          <input matInput [type]="showPassword().new ? 'text' : 'password'" formControlName="newPassword" />
          <button mat-icon-button matSuffix type="button" (click)="showPassword.update(s => ({ ...s, new: !s.new }))">
            <mat-icon>{{ showPassword().new ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          @if (form.controls.newPassword.hasError('minlength') && form.controls.newPassword.touched) {
            <mat-error>Password must be at least 6 characters</mat-error>
          }
        </mat-form-field>
      </div>

      <div class="col-12 col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Confirm new password</mat-label>
          <input matInput [type]="showPassword().confirm ? 'text' : 'password'" formControlName="confirmPassword" [errorStateMatcher]="mismatchMatcher" />
          <button mat-icon-button matSuffix type="button" (click)="showPassword.update(s => ({ ...s, confirm: !s.confirm }))">
            <mat-icon>{{ showPassword().confirm ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error>Passwords do not match</mat-error>
        </mat-form-field>
      </div>
    </div>

    <div class="profile-form__actions">
      <app-action-button
        [label]="saving() ? 'Updating...' : 'Update Password'"
        [icon]="''"
        variant="filled"
        [disabled]="saving() || form.pristine"
        (clicked)="save()"
      />
    </div>
  </form>
</section>
