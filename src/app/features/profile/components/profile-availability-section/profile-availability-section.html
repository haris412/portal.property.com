<section class="profile-section-card">
  <div class="profile-section-card__header">
    <h2>Agent Availability</h2>
    <p>Manage which days and hours clients can book or contact you.</p>
  </div>

  @if (error()) {
    <p class="profile-availability-section__message profile-availability-section__message--error" role="alert">
      {{ error() }}
    </p>
  }

  @if (loading()) {
    <p class="profile-availability-section__message">Loading availability…</p>
  } @else {
    <form [formGroup]="form">
      <div formArrayName="days" class="availability-list">
        @for (group of days.controls; track $index) {
          <div class="availability-row" [formGroupName]="$index">
            <div class="availability-row__day">
              <strong>{{ group.get('day')?.value }}</strong>
            </div>

            <div class="availability-row__toggle">
              <mat-slide-toggle formControlName="enabled">
                Available
              </mat-slide-toggle>
            </div>

            <div class="availability-row__time">
              <label>Start</label>
              <input type="time" formControlName="startTime" />
            </div>

            <div class="availability-row__time">
              <label>End</label>
              <input type="time" formControlName="endTime" />
            </div>
          </div>
        }
      </div>

      <div class="profile-form__actions">
        <app-action-button
          [label]="saving() ? 'Saving…' : 'Save Availability'"
          variant="filled"
          [icon]="''"
          (clicked)="save()"
          [disabled]="saving()"
          />
      </div>
    </form>
  }
</section>
