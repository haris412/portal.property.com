<section class="profile-section-card">
  <div class="profile-section-card__header">
    <h2>Account Settings</h2>
    <p>Manage your profile details and public information.</p>
  </div>

  <form class="profile-form" [formGroup]="form" (ngSubmit)="save()">
    <div class="row g-3">
      <div class="col-12 col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>First name</mat-label>
          <input matInput formControlName="firstName" />
        </mat-form-field>
      </div>

      <div class="col-12 col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Last name</mat-label>
          <input matInput formControlName="lastName" />
        </mat-form-field>
      </div>

      <div class="col-12 col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Email address</mat-label>
          <input matInput type="email" formControlName="email" />
        </mat-form-field>
      </div>

      <div class="col-12 col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Phone number</mat-label>
          <input matInput formControlName="phone" />
        </mat-form-field>
      </div>

      <div class="col-12 col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Title</mat-label>
          <input matInput formControlName="title" />
        </mat-form-field>
      </div>

      <div class="col-12 col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Company</mat-label>
          <input matInput formControlName="company" />
        </mat-form-field>
      </div>

      <div class="col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Location</mat-label>
          <input matInput formControlName="location" />
        </mat-form-field>
      </div>

      <div class="col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Bio</mat-label>
          <textarea matInput rows="5" formControlName="bio"></textarea>
        </mat-form-field>
      </div>
    </div>

    <div class="profile-form__actions">
      <button mat-flat-button type="submit" class="profile-form__primary-btn">
        Save Changes
      </button>
    </div>
  </form>
</section>
