<app-section-card
  title="Basic Information"
  description="Set the primary details of the property you want to list. You can also use AI to draft the title and description for faster publishing."
>
  <div class="row g-4" [formGroup]="form">
    <div class="col-12 col-lg-6">
      <label class="field-label">Purpose</label>

      <app-segmented-option-group
        [items]="purposeOptions()"
        [selectedValue]="form.get('purpose')?.value"
        (changed)="form.get('purpose')?.setValue($event)"
      />
    </div>

    <div class="col-12 col-lg-6">
      <label class="field-label">Property Type</label>

      <mat-form-field appearance="outline" class="w-100">
        <mat-select formControlName="propertyType">
          @for (type of propertyTypes(); track type.id) {
            <mat-option [value]="type.id">{{ type.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <div class="col-12">
      <div class="section-inline-header">
        <label class="field-label mb-0">Listing Title</label>
        <app-action-chip-list [items]="titleActions()" />
      </div>

      <mat-form-field appearance="outline" class="w-100">
        <input
          matInput
          formControlName="listingTitle"
          placeholder="2 Bed Apartment in DHA"
        />
      </mat-form-field>

      <app-info-banner
        icon="auto_awesome"
        text="AI can create a polished headline based on purpose, property type, bedrooms, location and amenities, then place it directly into the title field."
      />
    </div>

    <div class="col-12">
      <div class="section-inline-header">
        <label class="field-label mb-0">Property Description</label>
        <app-action-chip-list [items]="descriptionActions()" />
      </div>

      <mat-form-field appearance="outline" class="w-100">
        <textarea
          matInput
          rows="6"
          formControlName="propertyDescription"
          placeholder="Nice apartment..."
        ></textarea>
      </mat-form-field>

      <app-info-banner
        icon="smart_toy"
        text="The AI assistant can draft a complete description and auto-fill this field so the user does not need to write everything manually."
      />
    </div>
  </div>
</app-section-card>
