<app-step-card
  [step]="2"
  title="Contact Information"
  description="Add the public-facing contact details for this listing."
>
  <div class="d-grid gap-4" [formGroup]="form">
    <app-info-banner
      icon="call"
      [text]="contactBanner()"
    />

    @for (field of fields(); track field.id) {
      <div>
        <label class="field-label">{{ field.label }}</label>

        <mat-form-field appearance="outline" class="w-100">
          <input
            matInput
            [type]="field.type ?? 'text'"
            [placeholder]="field.placeholder"
            [formControlName]="
              field.id === 'name'
                ? 'contactName'
                : field.id === 'email'
                  ? 'contactEmail'
                  : field.id === 'phone'
                    ? 'contactPhoneNumber'
                    : 'contactLocation'
            "
          />
        </mat-form-field>
      </div>
    }
  </div>
</app-step-card>
