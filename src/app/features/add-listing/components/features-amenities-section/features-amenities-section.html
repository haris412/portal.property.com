<app-section-card
  [title]="'addListing.features.title' | translate"
  [description]="'addListing.features.description' | translate"
  icon="tune"
  variant="dashboard"
>
  @if (featuresState() === 'error') {
    <div class="features-amenities__state">
      <app-info-banner icon="error_outline" [text]="'addListing.features.error' | translate" />
      <button type="button" mat-stroked-button class="features-amenities__retry" (click)="retryLoadFeatures()">
        {{ 'addListing.retry' | translate }}
      </button>
    </div>
  } @else if (featuresState() === 'loading') {
    <div class="features-amenities__loading" role="status">
      {{ 'addListing.features.loading' | translate }}
    </div>
  } @else {
    <div class="features-amenities__content">
      <p class="features-amenities__hint">Choose every amenity that applies so the listing can be filtered accurately.</p>
      <app-selectable-chip-grid [items]="chipItems()" (toggled)="toggleAmenity($event)" />
    </div>
  }
</app-section-card>
