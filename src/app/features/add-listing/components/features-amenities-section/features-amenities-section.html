<app-section-card
  [title]="'addListing.features.title' | translate"
  [description]="'addListing.features.description' | translate"
>
  @if (featuresError()) {
    <app-info-banner icon="error_outline" [text]="'addListing.features.error' | translate" />
    <button type="button" mat-stroked-button class="mt-2" (click)="retryLoadFeatures()">
      {{ 'addListing.retry' | translate }}
    </button>
  } @else if (featuresLoading()) {
    <p class="text-muted mb-0">{{ 'addListing.features.loading' | translate }}</p>
  } @else {
    <app-selectable-chip-grid [items]="chipItems()" (toggled)="toggleAmenity($event)" />
  }
</app-section-card>
