<div class="dashboard-topbar row g-3 align-items-center">
  <div class="col-12 col-lg">
    <div class="dashboard-topbar__search">
      <mat-icon fontSet="material-symbols-outlined" inline>search</mat-icon>
      <input
        type="text"
        [(ngModel)]="searchTerm"
        placeholder="Search properties, leads, or locations..."
      />
    </div>
  </div>

  <div class="col-12 col-lg-auto">
    <div class="dashboard-topbar__actions">
      <a
        routerLink="/notifications"
        class="dashboard-topbar__icon-btn"
        aria-label="Notifications"
        title="Notifications"
      >
        <mat-icon fontSet="material-symbols-outlined" inline>notifications</mat-icon>
      </a>

      <app-action-button label="Quick Add" icon="add" (clicked)="goToAddListing()" />
    </div>
  </div>
</div>
