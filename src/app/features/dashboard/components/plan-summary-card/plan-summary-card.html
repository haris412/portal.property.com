<app-section-card [title]="name()" [description]="description()" density="compact">
  <div class="plan-summary-card">
    <div class="plan-summary-card__status-row">
      <span class="plan-summary-card__status">
        <mat-icon fontSet="material-symbols-outlined" inline aria-hidden="true">verified</mat-icon>
        {{ status() }}
      </span>
    </div>

    <div class="plan-summary-card__list">
      @for (feature of features(); track feature.label) {
        <div class="plan-summary-card__item">
          <span class="plan-summary-card__item-label">
            <mat-icon fontSet="material-symbols-outlined" inline aria-hidden="true">
              {{ featureIcon(feature.label) }}
            </mat-icon>
            {{ feature.label }}
          </span>
          <strong>{{ feature.value }}</strong>
        </div>
      }
    </div>

    <div class="plan-summary-card__usage">
      <div class="plan-summary-card__usage-row">
        <span>Plan usage</span>
        <strong>{{ usagePercent() }}%</strong>
      </div>
      <div class="plan-summary-card__progress">
        <span [style.width.%]="usagePercent()"></span>
      </div>
    </div>

    <a routerLink="/subscription-usage" class="plan-summary-card__cta">
      <mat-icon fontSet="material-symbols-outlined" inline aria-hidden="true">query_stats</mat-icon>
      <span>{{ 'subscriptionUsage.viewUsage' | translate }}</span>
    </a>
  </div>
</app-section-card>
